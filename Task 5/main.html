<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — Weather Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --sky-top: #2E1A47;
    --sky-mid: #7A3B6B;
    --sky-bottom: #F2A65A;
    --card: #FFFDF9;
    --ink: #2B2138;
    --muted: #756B84;
    --line: #ECE3E8;
    --sun: #F2A65A;
    --rain: #8E6BAE;
    --danger: #D9534F;
    --radius: 20px;
    --shadow: 0 20px 45px rgba(43,33,56,.16);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    background-attachment:fixed;
    padding:60px 20px 80px;
  }

  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; letter-spacing:-.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  :focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  .wrap{ max-width:760px; margin:0 auto; }

  header{
    text-align:center;
    color:#fff;
    margin-bottom:34px;
  }
  header h1{
    font-size:34px;
    margin-bottom:8px;
  }
  header p{
    color:rgba(255,255,255,.85);
    font-size:15px;
  }

  /* ---------------- Search ---------------- */
  .search-box{
    display:flex;
    gap:10px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    padding:8px;
    border-radius:16px;
    backdrop-filter:blur(6px);
    margin-bottom:28px;
  }
  .search-box input{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 16px;
    font-size:16px;
    color:#fff;
    outline:none;
  }
  .search-box input::placeholder{ color:rgba(255,255,255,.75); }
  .search-box button{
    border:none;
    background:#fff;
    color:var(--sky-top);
    font-weight:600;
    font-size:15px;
    padding:12px 22px;
    border-radius:11px;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .search-box button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(0,0,0,.18);
  }
  .search-box button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
  }

  /* ---------------- States ---------------- */
  .state-panel{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:44px 30px;
    text-align:center;
    color:var(--muted);
    display:none;
  }
  .state-panel.visible{ display:block; }

  .spinner{
    width:36px; height:36px;
    border:4px solid var(--line);
    border-top-color:var(--sky-top);
    border-radius:50%;
    margin:0 auto 16px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-panel .icon{ font-size:34px; margin-bottom:10px; }
  .error-panel h3{ color:var(--danger); margin-bottom:6px; font-size:18px; }
  .retry-btn{
    margin-top:16px;
    border:1.5px solid var(--danger);
    background:transparent;
    color:var(--danger);
    padding:9px 20px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .retry-btn:hover{
    background:var(--danger);
    color:#fff;
  }

  /* ---------------- Current weather ---------------- */
  .current-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 34px;
    margin-bottom:22px;
    display:none;
    animation: fadeIn .5s ease;
  }
  .current-card.visible{ display:block; }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .current-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:6px;
  }
  .place h2{ font-size:24px; }
  .place p{ color:var(--muted); font-size:14px; margin-top:2px; }

  .current-icon{ font-size:52px; line-height:1; }

  .temp-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-top:10px;
  }
  .temp-row .big{
    font-size:64px;
    font-weight:700;
    font-family:'Space Grotesk', sans-serif;
  }
  .temp-row .condition{
    font-size:17px;
    color:var(--muted);
  }

  .meta-row{
    display:flex;
    gap:26px;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .meta-row div p:first-child{
    font-size:13px;
    color:var(--muted);
  }
  .meta-row div p:last-child{
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    margin-top:3px;
  }

  /* ---------------- Forecast ---------------- */
  .forecast{
    display:none;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .forecast.visible{ display:grid; }

  .day-card{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:22px 16px;
    text-align:center;
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .day-card:hover{
    transform:translateY(-5px);
    box-shadow:0 26px 55px rgba(16,32,59,.2);
  }
  .day-card p.day-name{
    font-weight:600;
    font-size:14px;
    margin-bottom:10px;
    color:var(--muted);
  }
  .day-card .day-icon{ font-size:36px; margin-bottom:10px; }
  .day-card .day-temps{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
  }
  .day-card .day-temps .hi{ font-weight:600; }
  .day-card .day-temps .lo{ color:var(--muted); }

  footer{
    text-align:center;
    color:rgba(255,255,255,.75);
    font-size:13px;
    margin-top:40px;
  }
  footer .credit{
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.06em;
    color:rgba(255,255,255,.55);
  }

  @media (max-width:560px){
    .forecast{ grid-template-columns:1fr; }
    .temp-row .big{ font-size:52px; }
    .current-top{ flex-direction:column; gap:10px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Skyline</h1>
    <p>Search any city for live weather, powered by Open-Meteo</p>
  </header>

  <form class="search-box" id="searchForm">
    <input type="text" id="cityInput" placeholder="Try Karachi, London, Tokyo..." autocomplete="off">
    <button type="submit" id="searchBtn">Search</button>
  </form>

  <!-- Loading state -->
  <div class="state-panel" id="loadingPanel">
    <div class="spinner"></div>
    <p>Fetching the forecast...</p>
  </div>

  <!-- Error state -->
  <div class="state-panel error-panel" id="errorPanel">
    <div class="icon">⚠️</div>
    <h3 id="errorTitle">Couldn't get that forecast</h3>
    <p id="errorMsg">Something went wrong. Please try again.</p>
    <button class="retry-btn" id="retryBtn">Try again</button>
  </div>

  <!-- Current weather -->
  <div class="current-card" id="currentCard">
    <div class="current-top">
      <div class="place">
        <h2 id="cityName">—</h2>
        <p id="cityRegion">—</p>
      </div>
      <div class="current-icon" id="currentIcon">☀️</div>
    </div>

    <div class="temp-row">
      <span class="big" id="currentTemp">--°</span>
      <span class="condition" id="currentCondition">—</span>
    </div>

    <div class="meta-row">
      <div>
        <p>Feels like</p>
        <p id="feelsLike">--°</p>
      </div>
      <div>
        <p>Wind</p>
        <p id="windSpeed">-- km/h</p>
      </div>
      <div>
        <p>Humidity</p>
        <p id="humidity">--%</p>
      </div>
    </div>
  </div>

  <!-- 3-day forecast -->
  <div class="forecast" id="forecast"></div>

  <footer>
    <p>Data from open-meteo.com — no API key required</p>
    <p class="credit">Made by Jia</p>
  </footer>
</div>

<script>
  // ===============================================
  // WMO weather code -> { icon, label }
  // ===============================================
  const WEATHER_CODES = {
    0:  { icon: '☀️',  label: 'Clear sky' },
    1:  { icon: '🌤️', label: 'Mainly clear' },
    2:  { icon: '⛅',  label: 'Partly cloudy' },
    3:  { icon: '☁️',  label: 'Overcast' },
    45: { icon: '🌫️', label: 'Fog' },
    48: { icon: '🌫️', label: 'Depositing rime fog' },
    51: { icon: '🌦️', label: 'Light drizzle' },
    53: { icon: '🌦️', label: 'Drizzle' },
    55: { icon: '🌧️', label: 'Dense drizzle' },
    56: { icon: '🌧️', label: 'Freezing drizzle' },
    57: { icon: '🌧️', label: 'Freezing drizzle' },
    61: { icon: '🌦️', label: 'Light rain' },
    63: { icon: '🌧️', label: 'Rain' },
    65: { icon: '🌧️', label: 'Heavy rain' },
    66: { icon: '🌧️', label: 'Freezing rain' },
    67: { icon: '🌧️', label: 'Freezing rain' },
    71: { icon: '🌨️', label: 'Light snow' },
    73: { icon: '🌨️', label: 'Snow' },
    75: { icon: '❄️',  label: 'Heavy snow' },
    77: { icon: '❄️',  label: 'Snow grains' },
    80: { icon: '🌦️', label: 'Rain showers' },
    81: { icon: '🌧️', label: 'Rain showers' },
    82: { icon: '⛈️', label: 'Violent showers' },
    85: { icon: '🌨️', label: 'Snow showers' },
    86: { icon: '❄️',  label: 'Snow showers' },
    95: { icon: '⛈️', label: 'Thunderstorm' },
    96: { icon: '⛈️', label: 'Thunderstorm + hail' },
    99: { icon: '⛈️', label: 'Thunderstorm + hail' },
  };

  function codeInfo(code){
    return WEATHER_CODES[code] || { icon: '🌡️', label: 'Unknown' };
  }

  // ===============================================
  // Elements
  // ===============================================
  const form = document.querySelector('#searchForm');
  const input = document.querySelector('#cityInput');
  const searchBtn = document.querySelector('#searchBtn');

  const loadingPanel = document.querySelector('#loadingPanel');
  const errorPanel = document.querySelector('#errorPanel');
  const errorTitle = document.querySelector('#errorTitle');
  const errorMsg = document.querySelector('#errorMsg');
  const retryBtn = document.querySelector('#retryBtn');

  const currentCard = document.querySelector('#currentCard');
  const forecastEl = document.querySelector('#forecast');

  let lastQuery = '';

  // ===============================================
  // UI state helpers — only one state visible at a time
  // ===============================================
  function showLoading(){
    loadingPanel.classList.add('visible');
    errorPanel.classList.remove('visible');
    currentCard.classList.remove('visible');
    forecastEl.classList.remove('visible');
    searchBtn.disabled = true;
  }

  function showError(title, message){
    loadingPanel.classList.remove('visible');
    errorPanel.classList.add('visible');
    currentCard.classList.remove('visible');
    forecastEl.classList.remove('visible');
    searchBtn.disabled = false;
    errorTitle.textContent = title;
    errorMsg.textContent = message;
  }

  function showResults(){
    loadingPanel.classList.remove('visible');
    errorPanel.classList.remove('visible');
    currentCard.classList.add('visible');
    forecastEl.classList.add('visible');
    searchBtn.disabled = false;
  }

  // ===============================================
  // Fetch geocoding + weather, then render
  // ===============================================
  async function fetchWeatherFor(city){
    showLoading();

    try{
      // Step 1: turn a city name into coordinates
      const geoUrl = 'https://geocoding-api.open-meteo.com/v1/search?name='
        + encodeURIComponent(city) + '&count=1&language=en&format=json';

      const geoRes = await fetch(geoUrl);
      if (!geoRes.ok){
        throw new Error('geocoding-failed');
      }
      const geoData = await geoRes.json();

      if (!geoData.results || geoData.results.length === 0){
        showError('City not found', 'We couldn\'t find "' + city + '". Check the spelling and try again.');
        return;
      }

      const place = geoData.results[0];

      // Step 2: fetch the actual forecast for those coordinates
      const weatherUrl = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + place.latitude
        + '&longitude=' + place.longitude
        + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
        + '&timezone=auto&forecast_days=3';

      const weatherRes = await fetch(weatherUrl);
      if (!weatherRes.ok){
        throw new Error('weather-failed');
      }
      const weatherData = await weatherRes.json();

      renderCurrent(place, weatherData.current);
      renderForecast(weatherData.daily);
      showResults();

    } catch (err){
      // Network failure, offline, DNS issue, etc. all land here
      showError('Connection problem', 'Couldn\'t reach the weather service. Check your internet connection and try again.');
    }
  }

  function renderCurrent(place, current){
    const info = codeInfo(current.weather_code);

    document.querySelector('#cityName').textContent = place.name;
    document.querySelector('#cityRegion').textContent =
      [place.admin1, place.country].filter(Boolean).join(', ');

    document.querySelector('#currentIcon').textContent = info.icon;
    document.querySelector('#currentTemp').textContent = Math.round(current.temperature_2m) + '°';
    document.querySelector('#currentCondition').textContent = info.label;
    document.querySelector('#feelsLike').textContent = Math.round(current.apparent_temperature) + '°';
    document.querySelector('#windSpeed').textContent = Math.round(current.wind_speed_10m) + ' km/h';
    document.querySelector('#humidity').textContent = Math.round(current.relative_humidity_2m) + '%';
  }

  function renderForecast(daily){
    forecastEl.textContent = ''; // clear previous results, no innerHTML string-building

    const dayNames = ['Today', 'Tomorrow'];

    daily.time.forEach(function(dateStr, i){
      const info = codeInfo(daily.weather_code[i]);
      const label = dayNames[i] || new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short' });

      const card = document.createElement('div');
      card.className = 'day-card';

      const name = document.createElement('p');
      name.className = 'day-name';
      name.textContent = label;

      const icon = document.createElement('p');
      icon.className = 'day-icon';
      icon.textContent = info.icon;

      const temps = document.createElement('p');
      temps.className = 'day-temps';

      const hi = document.createElement('span');
      hi.className = 'hi';
      hi.textContent = Math.round(daily.temperature_2m_max[i]) + '°';

      const lo = document.createElement('span');
      lo.className = 'lo';
      lo.textContent = ' / ' + Math.round(daily.temperature_2m_min[i]) + '°';

      temps.appendChild(hi);
      temps.appendChild(lo);

      card.appendChild(name);
      card.appendChild(icon);
      card.appendChild(temps);

      forecastEl.appendChild(card);
    });
  }

  // ===============================================
  // Events
  // ===============================================
  
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const city = input.value.trim();
    if (city === '') return;
    lastQuery = city;
    fetchWeatherFor(city);
  });

  retryBtn.addEventListener('click', function(){
    if (lastQuery) fetchWeatherFor(lastQuery);
  });

  // Load a default city on first visit so the page isn't empty
  input.value = 'Karachi';
  lastQuery = 'Karachi';
  fetchWeatherFor('Karachi');
</script>

</body>
</html>
